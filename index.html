<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loop Check 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="3D instrumentation career game: walk a live plant, use real test tools, rise from instrument mechanic to instrument engineer. English, Hindi, Urdu.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<style>
/* Layout: control-room HMI. Grey panels; colour is kept for state (alarm, frozen, bad, good) and the amber "act" control. */
:root {
  --bg: #171c20; --panel: #20272c; --panel2: #283037; --line: #37424a; --fg: #e4e9ec; --muted: #94a2ab;
  --accent: #6cc3d5; --amber: #f2b33d; --alarm: #ef5b5b; --frozen: #c58cf0; --good: #5cc28f;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
:lang(hi) { --body: "Noto Sans Devanagari", "Barlow", sans-serif; --display: "Noto Sans Devanagari", "Barlow Condensed", sans-serif; }
:lang(ur) { --body: "Noto Nastaliq Urdu", "Noto Naskh Arabic", serif; --display: "Noto Nastaliq Urdu", serif; }
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font: 16px/1.5 var(--body); }
:lang(ur) body, body:lang(ur) { line-height: 2.05; font-size: 15px; }
#app { max-width: 1280px; margin: 0 auto; padding-block: 12px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.n { font-family: var(--mono); font-variant-numeric: tabular-nums; unicode-bidi: isolate; }
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: .01em; }
.lbl { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; }
:lang(ur) .lbl, :lang(hi) .lbl { text-transform: none; letter-spacing: 0; font-size: 13px; }
.brand { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 26px; letter-spacing: .12em; }
.brand span { color: var(--amber); }
.brand.big { font-size: clamp(48px, 12vw, 96px); line-height: 1; }
/* language pick */
.pick { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
.pick-sub { color: var(--muted); margin: 0; }
.pick-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.pickb { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 26px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 170px; }
.pickb:hover { border-color: var(--accent); }
.pickb b { font-size: 24px; } .pickb small { color: var(--muted); }
.pickb[lang=hi] { font-family: "Noto Sans Devanagari", sans-serif; } .pickb[lang=ur] { font-family: "Noto Nastaliq Urdu", serif; }
/* top bars */
.top, .mbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; padding-block: 6px 14px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.mbar .mtitle { flex: 1 1 220px; min-width: 0; } .mbar h1 { font-size: 24px; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.lg { background: transparent; border: 0; padding: 6px 10px; cursor: pointer; font-size: 14px; color: var(--muted); line-height: 1.4; }
.lg[lang=hi] { font-family: "Noto Sans Devanagari", sans-serif; } .lg[lang=ur] { font-family: "Noto Nastaliq Urdu", serif; }
.lg.on { background: var(--panel2); color: var(--fg); }
.clock b { font-size: 18px; color: var(--accent); }
/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: #0c1a1e; border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; text-decoration: none; }
.btn.amber { background: var(--amber); color: #231700; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.sm { padding: 6px 12px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.linkb { background: none; border: 0; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 4px 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
.chip { display: inline-block; font-family: var(--body); font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); vertical-align: middle; }
.chip.free { color: var(--good); border-color: var(--good); } .chip.paid { color: var(--amber); border-color: var(--amber); } .chip.ok { color: var(--good); border-color: var(--good); } .chip.bad { color: var(--alarm); border-color: var(--alarm); }
.good { color: var(--good); } .warn { color: var(--amber); } .bad { color: var(--alarm); }
/* home */
.hero { display: grid; grid-template-columns: 1fr 70px; gap: 24px; align-items: stretch; margin-bottom: 8px; }
.hero h1 { font-size: clamp(26px, 4.4vw, 44px); line-height: 1.12; max-width: 24ch; }
:lang(ur) .hero h1 { line-height: 1.9; font-size: clamp(22px, 3.6vw, 34px); }
.stats { display: flex; flex-wrap: wrap; gap: 24px; margin: 18px 0; }
.stats b { font-size: 20px; }
.paidnote { color: var(--good); }
.meter { position: relative; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); min-height: 200px; }
.meter-fill { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(to top, var(--accent), color-mix(in srgb, var(--accent) 40%, transparent)); border-radius: 0 0 5px 5px; transition: height .6s; }
.meter span { position: absolute; inset-inline-start: 6px; transform: translateY(50%); font: 12px var(--mono); color: var(--fg); text-shadow: 0 0 3px var(--bg); }
.meter span:first-of-type { transform: translateY(100%); } .meter span:last-of-type { transform: none; }
.passmark { color: var(--muted); font-size: 14px; }
.ladder { display: flex; flex-direction: column; gap: 12px; }
.rung { display: grid; grid-template-columns: 74px 1fr; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.rung.done { border-color: color-mix(in srgb, var(--good) 50%, var(--line)); }
.rung.shut .rung-body > p, .rung.shut h2 { opacity: .7; }
.rung-mA { font-size: 22px; color: var(--accent); font-weight: 600; }
.rung h2 { font-size: 22px; } .rung p { margin: 4px 0 10px; color: var(--muted); }
.jobs { display: flex; flex-direction: column; gap: 8px; }
.job { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; background: var(--panel2); border-radius: 8px; flex-wrap: wrap; }
.job small { display: block; font-size: 13px; }
.lockmsg { font-size: 13px; color: var(--muted); }
.foot { margin-top: 28px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 12px; }
/* mission grid */
.mgrid { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr) minmax(260px, 360px); gap: 14px; align-items: start; }
.mgrid.two { grid-template-columns: minmax(260px, 360px) minmax(0, 1fr); }
.mgrid > * { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.sec { font-size: 19px; margin-bottom: 10px; }
.radio p { margin: 0; font-style: italic; }
:lang(ur) .radio p { font-style: normal; }
.dcs table { width: 100%; border-collapse: collapse; }
.dcs td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
.dcs .val { text-align: end; font-size: 18px; }
.dcs .dot { width: 14px; } .dcs .dot::after { content: ""; display: block; width: 10px; height: 10px; border-radius: 2px; background: var(--line); }
.dcs tr.alarm .val { color: var(--alarm); } .dcs tr.alarm .dot::after { background: var(--alarm); animation: blink 1s steps(2) infinite; }
.dcs tr.frozen .val { color: var(--frozen); } .dcs tr.frozen .dot::after { background: var(--frozen); }
.dcs tr.bad .val { color: var(--frozen); } .dcs tr.bad .dot::after { background: var(--frozen); }
@keyframes blink { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .dcs tr.alarm .dot::after { animation: none; } .meter-fill { transition: none; } }
.grp { margin-bottom: 12px; } .grp:last-child { margin-bottom: 0; }
.g-safety .lbl { color: var(--amber); } .g-verify .lbl { color: var(--good); }
.abtns { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.abtn { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; text-align: start; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; cursor: pointer; line-height: 1.35; width: 100%; }
:lang(ur) .abtn { line-height: 1.9; }
.abtn:hover { border-color: var(--accent); }
.abtn small { color: var(--muted); white-space: nowrap; font-size: 12px; }
.abtn.did { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.abtn.did span::before { content: "✓ "; color: var(--accent); }
.col-l .abtn { margin-bottom: 8px; }
.evp { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; max-height: 70vh; overflow-y: auto; }
.log li { display: grid; grid-template-columns: 62px 1fr; gap: 8px; border-inline-start: 2px solid var(--line); padding-inline-start: 8px; }
.log li.safe { border-color: var(--amber); } .log li.act { border-color: var(--good); }
.log li.empty { display: block; color: var(--muted); border: 0; }
.log .lt { font-size: 12px; color: var(--muted); } .log b { font-size: 14px; } .log p { margin: 2px 0 0; font-size: 14px; }
.q { color: var(--muted); margin: 0 0 10px; }
.opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.opt { display: flex; gap: 8px; align-items: flex-start; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--panel2); text-align: start; }
.opt.on { border-color: var(--accent); }
.opt.sm { font-size: 14px; padding: 6px 9px; }
.opt input { margin-top: 4px; accent-color: var(--accent); }
.btnopt:hover { border-color: var(--amber); }
.claims { border-top: 1px dashed var(--line); padding-top: 10px; }
.checks { list-style: none; padding: 0; margin: 0 0 6px; } .checks li { padding: 4px 0; color: var(--muted); } .checks li.ok { color: var(--good); }
.plant svg, .card svg { width: 100%; height: auto; display: block; }
/* drawings */
.pid { font-family: var(--mono); }
.pid .pipe { fill: none; stroke: var(--fg); stroke-width: 2.2; }
.pid .imp { fill: none; stroke: var(--muted); stroke-width: 1.4; }
.pid .sig { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
.pid .wet { fill: none; stroke: var(--accent); stroke-width: 4; opacity: .5; }
.pid .dim { fill: none; stroke: var(--muted); stroke-width: 1; }
.pid .eq, .pid .valve, .pid .act, .pid .gauge { fill: var(--panel2); stroke: var(--fg); stroke-width: 1.6; }
.pid .liq { fill: color-mix(in srgb, var(--accent) 22%, transparent); stroke: none; }
.pid .coil { fill: none; stroke: var(--amber); stroke-width: 1.5; }
.pid .eqt { fill: var(--fg); font-size: 11px; text-anchor: middle; }
.pid .lab { fill: var(--muted); font-size: 10px; }
.pid .bub circle { fill: var(--panel); stroke: var(--fg); stroke-width: 1.4; }
.pid .bub .sq { fill: none; stroke: var(--fg); stroke-width: 1.2; }
.pid .bub line { stroke: var(--fg); stroke-width: 1; }
.pid .bub text { fill: var(--fg); font-size: 9px; text-anchor: middle; }
.pid .hl circle, .pid .hl.eq, .pid .eq.hl, .pid .valve.hl, .pid .act.hl, .pid .hl .gauge, .pid .hl rect { stroke: var(--amber); stroke-width: 2.4; }
.pid .hl text { fill: var(--amber); }
/* calibration & tables */
.tw { overflow-x: auto; }
table.cal { width: 100%; border-collapse: collapse; font-size: 14px; }
table.cal th { text-align: start; font-weight: 500; color: var(--muted); padding: 6px; border-bottom: 1px solid var(--line); }
table.cal td { padding: 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.bad { color: var(--alarm); font-weight: 600; }
table.given td:nth-child(-n+2) { white-space: nowrap; }
table.given td { padding: 4px 8px 4px 0; vertical-align: top; font-size: 14px; } table.given td:last-child { color: var(--muted); }
/* plan */
.cap { height: 12px; background: var(--panel2); border-radius: 6px; overflow: hidden; margin: 6px 0; } .cap div { height: 100%; background: var(--accent); } .cap.over div { background: var(--alarm); }
.jobh { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; } .jobh p { margin: 0; flex: 1 1 240px; min-width: 0; }
.tagc { background: var(--panel2); padding: 2px 8px; border-radius: 6px; }
.seg { gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: inline-flex; margin-top: 10px; }
.segb { background: transparent; border: 0; padding: 7px 14px; cursor: pointer; color: var(--muted); border-inline-end: 1px solid var(--line); }
.segb:last-child { border-inline-end: 0; } .segb.on { background: var(--accent); color: #0c1a1e; font-weight: 600; }
.needs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
/* review record: a paper form inside the dark room */
.record { background: #eef0ea; color: #1d2326; border-color: #c9cdc3; }
.record table.cal th, .record table.cal td { border-color: #c9cdc3; color: #1d2326; }
.rech { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; border-bottom: 2px solid #1d2326; padding-bottom: 6px; margin-bottom: 10px; font-family: "Barlow Condensed", sans-serif; font-size: 18px; letter-spacing: .06em; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; margin: 10px 0; }
.fld { text-align: start; background: #fff; border: 1px dashed #9aa19a; border-radius: 6px; padding: 6px 8px; cursor: pointer; min-height: 52px; color: #1d2326; }
.fld .lbl { color: #5d665f; }
.fld.flag { border: 2px solid #c62f2f; background: #fbe9e9; }
.fld.flag::after { content: "⚑"; color: #c62f2f; float: inline-end; }
/* calc */
.qrow { padding: 10px 0; border-bottom: 1px solid var(--line); } .qrow label { display: block; margin-bottom: 6px; }
.qrow.ok input { border-color: var(--good); } .qrow.no input { border-color: var(--alarm); }
.inrow { display: flex; gap: 8px; align-items: center; }
input[type=radio], input[type=checkbox] { width: auto; flex: none; }
input:not([type=radio]):not([type=checkbox]) { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; max-width: 260px; }
.unit { color: var(--muted); }
/* result */
.result { display: flex; flex-direction: column; gap: 14px; max-width: 820px; }
.scorecard { display: flex; align-items: center; gap: 18px; }
.scorecard .big { font-size: 64px; line-height: 1; color: var(--amber); }
.scorecard.pass .big { color: var(--good); }
.promo { color: var(--amber); margin: 6px 0 0; font-size: 18px; }
.sbar { display: grid; grid-template-columns: minmax(110px, 160px) 1fr 64px; gap: 10px; align-items: center; padding: 4px 0; }
.sbar .track { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; } .sbar .track div { height: 100%; background: var(--accent); }
.sbar.neg b { color: var(--amber); } .sbar b { text-align: end; }
.note { color: var(--amber); margin: 6px 0 0; font-size: 14px; } .note.small { color: var(--muted); font-size: 12px; }
.pre { margin: 0; }
.path { margin: 0; padding-inline-start: 20px; color: var(--muted); font-size: 14px; } .path li { padding: 2px 0; }
/* modal */
.modal { position: fixed; inset: 0; background: rgb(0 0 0 / .6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.mbox { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: 10px; padding: 18px; max-width: 460px; width: 100%; display: flex; flex-direction: column; gap: 10px; max-height: 90vh; overflow-y: auto; }
.mbox.warn { border-top-color: var(--amber); } .mbox.bad { border-top-color: var(--alarm); }
.mbox h3 { font-size: 22px; } .mbox p { margin: 0; }
.mbox input { max-width: none; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); inset-inline: 16px; margin: auto; max-width: 420px; background: var(--good); color: #062214; padding: 12px 16px; border-radius: 8px; z-index: 30; font-weight: 600; }
@media (max-width: 1080px) { .mgrid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .mgrid .col-r { grid-column: 1 / -1; } }
@media (max-width: 720px) { .mgrid, .mgrid.two { grid-template-columns: minmax(0, 1fr); } .hero { grid-template-columns: 1fr 48px; } .rung { grid-template-columns: 1fr; } .mbar h1 { font-size: 20px; } .log { max-height: none; } .sbar { grid-template-columns: 100px 1fr 56px; } }

/* 3D layer: full-screen canvas under an overlay that only catches clicks on its controls */
html, body { height: 100%; overflow: hidden; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: #bcd3e4; }
#app { position: fixed; inset: 0; max-width: none; margin: 0; padding: 0; pointer-events: none; }
#app > * { pointer-events: auto; }
#app > .hud { pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud .cross, .hud .prompt, .hud .marker, .hud .toast3 { pointer-events: none; }
.menu { position: absolute; inset: 0; overflow-y: auto; background: linear-gradient(to bottom, rgb(23 28 32 / .82), rgb(23 28 32 / .94)); padding-block: 12px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.menu > * { max-width: 1100px; margin-left: auto; margin-right: auto; }
.pick { position: absolute; inset: 0; background: rgb(23 28 32 / .78); padding: 16px; }
body.no3d #scene { display: none; }
/* HUD */
.obj { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); inset-inline-start: max(12px, env(safe-area-inset-left, 0px)); max-width: min(360px, 60vw); background: rgb(23 28 32 / .78); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(4px); }
.obj b { display: block; font-family: var(--display); font-size: 19px; } .obj p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.hbtns { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); inset-inline-end: max(12px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: 60vw; }
.hb, .hchip { background: rgb(23 28 32 / .8); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; color: var(--fg); cursor: pointer; font-size: 14px; }
.hchip { cursor: default; color: var(--accent); }
.hbtns .lang { background: rgb(23 28 32 / .8); }
.cross { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border: 2px solid rgb(255 255 255 / .85); border-radius: 50%; box-shadow: 0 0 0 1px rgb(0 0 0 / .35); }
.prompt { position: absolute; left: 50%; top: calc(50% + 24px); transform: translateX(-50%); background: rgb(23 28 32 / .85); border: 1px solid var(--amber); color: var(--fg); padding: 6px 12px; border-radius: 8px; white-space: nowrap; font-size: 15px; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; }
.kbd { display: inline-block; background: var(--amber); color: #231700; font: 600 12px var(--mono); border-radius: 4px; padding: 0 6px; margin-inline-end: 6px; }
.marker { position: absolute; transform: translate(-50%, -100%); color: var(--amber); font-size: 26px; text-shadow: 0 0 6px #000; animation: bob 1.2s ease-in-out infinite; }
.marker::after { content: attr(data-d); display: block; font: 600 12px var(--mono); text-align: center; }
@keyframes bob { 50% { transform: translate(-50%, -115%); } }
.belt { position: absolute; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
.tool { position: relative; width: 68px; height: 62px; background: rgb(23 28 32 / .82); border: 2px solid var(--line); border-radius: 10px; color: var(--fg); font-size: 22px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.tool small { font-size: 10px; color: var(--muted); max-width: 64px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tool .k { position: absolute; top: 2px; inset-inline-start: 5px; font-size: 10px; color: var(--muted); }
.tool.on { border-color: var(--amber); box-shadow: 0 0 0 2px rgb(242 179 61 / .3); }
.joy, .usebtn { display: none; }

  mA(pv, lrv, urv) { const m = 4 + 16 * (pv - lrv) / (urv - lrv); return Math.min(20.5, Math.max(3.8, m)); },
  pct(pv, lrv, urv) { return 100 * (pv - lrv) / (urv - lrv); },
  fromMA(mA, lrv, urv) { return lrv + (mA - 4) / 16 * (urv - lrv); },

  pt100R(t) { return 100 * (1 + SIM.A * t + SIM.B * t * t); },

/* Compact SHA-256 (works without a secure context, e.g. when the file is opened locally) */
function sha256(ascii) {
  const rr = (v, a) => (v >>> a) | (v << (32 - a));
  const K = [], H = [];
  let p = 2;
  for (let i = 0; i < 64; p++) {
    let prime = true;
    for (let d = 2; d * d <= p; d++) if (p % d === 0) { prime = false; break; }
    if (!prime) continue;
    if (i < 8) H[i] = (Math.pow(p, 1 / 2) * 4294967296) | 0;
    K[i++] = (Math.pow(p, 1 / 3) * 4294967296) | 0;
  }
  const bytes = Array.from(new TextEncoder().encode(ascii));
  const bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(i >= 4 ? 0 : (bitLen >>> (i * 8)) & 255);
  const w = new Array(64);
  for (let j = 0; j < bytes.length; j += 64) {
    for (let i = 0; i < 16; i++) w[i] = (bytes[j + i * 4] << 24) | (bytes[j + i * 4 + 1] << 16) | (bytes[j + i * 4 + 2] << 8) | bytes[j + i * 4 + 3];
    for (let i = 16; i < 64; i++) {
      const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
      const s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';   // Crockford alphabet (no I, L, O, U)
function codeCheck(body, secret) {
  const hx = sha256(secret + ':' + body);
  let out = '';
  for (let i = 0; i < 4; i++) out += B32[parseInt(hx.substr(i * 2, 2), 16) % 32];
  return out;
}
/* Access code format: LC-XXXXX-XXXXX-CCCC */
function validAccessCode(raw) {
  let c = raw.toUpperCase().replace(/\s+/g, '');
  if (!c.startsWith('LC')) return false;
  c = c.slice(2).replace(/O/g, '0').replace(/[IL]/g, '1');
  const m = c.match(/^-?([0-9A-Z]{5})-?([0-9A-Z]{5})-?([0-9A-Z]{4})$/);
  if (!m) return false;
  return codeCheck(m[1] + m[2], CONFIG.CODE_SECRET) === m[3];
}
async function verifyGumroad(key) {
  if (!CONFIG.GUMROAD_PRODUCT_ID) return false;
  try {
    const body = new URLSearchParams({ product_id: CONFIG.GUMROAD_PRODUCT_ID, license_key: key.trim(), increment_uses_count: 'false' });
    const r = await fetch('https://api.gumroad.com/v2/licenses/verify', { method: 'POST', body });
    const j = await r.json();
    return !!(j.success && j.purchase && !j.purchase.refunded && !j.purchase.chargebacked);
  } catch (e) { return false; }
}
async function checkKey(key) {
  if (validAccessCode(key)) return true;
  return verifyGumroad(key);
}

function verifyM1(v, st, L) {

  if (!st.fixed) return { en: `The readings still disagree: PG-103 ${N(f1(rdM1(v, st).pg))}, PT-103 ${N(f1(rdM1(v, st).pt))}, test gauge ${N(f2(v.trueP))} bar. The fault is still there.`, hi: `रीडिंग अब भी मेल नहीं खातीं: PG-103 ${N(f1(rdM1(v, st).pg))}, PT-103 ${N(f1(rdM1(v, st).pt))}, टेस्ट गेज ${N(f2(v.trueP))} bar। फॉल्ट अभी भी है।`, ur: `ریڈنگ اب بھی نہیں ملتیں: PG-103 ${N(f1(rdM1(v, st).pg))}، PT-103 ${N(f1(rdM1(v, st).pt))}، ٹیسٹ گیج ${N(f2(v.trueP))} bar۔ فالٹ ابھی موجود ہے۔` }[L];
  if (v.k === 'cal') return { en: `Notification raised with your test-gauge result attached. The operator confirms he will use PG-103 (${N('6.8 bar')}) until the technician calibrates PT-103.`, hi: `टेस्ट गेज के नतीजे के साथ नोटिफिकेशन दिया गया। ऑपरेटर ने पुष्टि की कि टेक्नीशियन के PT-103 कैलिब्रेट करने तक वह PG-103 (${N('6.8 bar')}) देखेगा।`, ur: `ٹیسٹ گیج کے نتیجے کے ساتھ نوٹیفکیشن دیا گیا۔ آپریٹر نے تصدیق کی کہ ٹیکنیشن کے PT-103 کیلیبریٹ کرنے تک وہ PG-103 (${N('6.8 bar')}) دیکھے گا۔` }[L];
  return { en: `All three now agree within tolerance: PG-103 ${N(f1(v.trueP))}, PT-103 ${N(f1(v.trueP))}, test gauge ${N(f2(v.trueP))} bar. The PT-103 trend is moving.`, hi: `अब तीनों टॉलरेंस में मेल खाते हैं: PG-103 ${N(f1(v.trueP))}, PT-103 ${N(f1(v.trueP))}, टेस्ट गेज ${N(f2(v.trueP))} bar। PT-103 का ट्रेंड चल रहा है।`, ur: `اب تینوں ٹالرینس میں ملتے ہیں: PG-103 ${N(f1(v.trueP))}، PT-103 ${N(f1(v.trueP))}، ٹیسٹ گیج ${N(f2(v.trueP))} bar۔ PT-103 کا ٹرینڈ چل رہا ہے۔` }[L];
}
function rdM1(v, st) {
  const pg = v.k === 'gauge' && !st.fixed ? 6.8 : v.trueP;

/* S1 · Senior Instrument Technician · TT-104 reads higher than the local thermometer (Pt100, 3-wire) */
function rdS1(v, st) {
  const Rs = SIM.pt100R(v.T);                           // true sensor resistance
  let Rmeas;                                            // what the transmitter computes
  if (v.k === 'twowire' && !st.fixed) Rmeas = Rs + 2 * v.RL;          // 2-wire config adds both leads
  else if (v.k === 'corrode' && !st.fixed) Rmeas = Rs + v.extra;     // 3-wire: R_A − R_C imbalance adds to reading
  else Rmeas = Rs;
  const Ttx = SIM.pt100T(Rmeas);
  const mA = SIM.mA(Ttx, 0, 150);
  const dcsURV = v.k === 'range' && !st.fixed ? 200 : 150;
  const dcs = SIM.fromMA(mA, 0, dcsURV);
  return { Rs, Ttx, mA, dcs, dcsURV };
}

function leadsS1(v, st, L) {
  const RL = v.k === 'corrode' ? 1.8 : v.RL;
  const ra = RL + (v.k === 'corrode' && !st.fixed ? v.extra : 0), rb = RL, rc = RL;
  const Rs = SIM.pt100R(v.T);
  const ab = Rs + ra + rb, bc = rb + rc;
  const t = { en: `Red–White(1): ${N(f2(ab) + ' Ω')}. White(1)–White(2): ${N(f2(bc) + ' Ω')} (two leads, so ${N(f2(bc / 2) + ' Ω')} each). Sensor alone at ${N(f1(v.T) + ' °C')} should be ${N(f2(Rs) + ' Ω')}, so the red lead path is ${N(f2(ab - Rs - bc / 2) + ' Ω')}.`,
    hi: `लाल–सफ़ेद(1): ${N(f2(ab) + ' Ω')}। सफ़ेद(1)–सफ़ेद(2): ${N(f2(bc) + ' Ω')} (दो लीड, यानी हर एक ${N(f2(bc / 2) + ' Ω')})। ${N(f1(v.T) + ' °C')} पर सिर्फ़ सेंसर ${N(f2(Rs) + ' Ω')} होना चाहिए, इसलिए लाल लीड का रास्ता ${N(f2(ab - Rs - bc / 2) + ' Ω')} है।`,
    ur: `سرخ–سفید(1): ${N(f2(ab) + ' Ω')}۔ سفید(1)–سفید(2): ${N(f2(bc) + ' Ω')} (دو لیڈز، یعنی ہر ایک ${N(f2(bc / 2) + ' Ω')})۔ ${N(f1(v.T) + ' °C')} پر صرف سینسر ${N(f2(Rs) + ' Ω')} ہونا چاہیے، اس لیے سرخ لیڈ کا راستہ ${N(f2(ab - Rs - bc / 2) + ' Ω')} ہے۔` };
  return t[L];
}

  brief: T(
    'The proof test of safety function LSLL-105 is due. LT-105 (SIS transmitter, range 0–3000 mmH₂O on T-101) must stop pump P-101 when the level falls to 10 % (300 mm) to protect the pump from running dry. Safety Requirements Specification: trip at 10 % ±1 % of span, pump stops within 5 s. Test it end to end and record the result honestly.',
    'सेफ़्टी फ़ंक्शन LSLL-105 का प्रूफ़ टेस्ट ड्यू है। LT-105 (SIS ट्रांसमीटर, T-101 पर रेंज 0–3000 mmH₂O) को लेवल 10 % (300 mm) तक गिरने पर पंप P-101 रोकना चाहिए, ताकि पंप सूखा न चले। सेफ़्टी रिक्वायरमेंट स्पेसिफ़िकेशन: ट्रिप 10 % ±1 % स्पैन पर, पंप 5 s में रुके। एंड-टू-एंड टेस्ट करें और नतीजा ईमानदारी से लिखें।',
    'سیفٹی فنکشن LSLL-105 کا پروف ٹیسٹ واجب ہے۔ LT-105 (SIS ٹرانسمیٹر، T-101 پر رینج 0–3000 mmH₂O) کو لیول 10 % (300 mm) تک گرنے پر پمپ P-101 روکنا چاہیے، تاکہ پمپ خشک نہ چلے۔ سیفٹی ریکوائرمنٹ اسپیسیفکیشن: ٹرپ 10 % ±1 % اسپین پر، پمپ 5 s میں رکے۔ اینڈ ٹو اینڈ ٹیسٹ کریں اور نتیجہ ایمانداری سے لکھیں۔'),
  setup(r) {
    const k = ['pass', 'setpoint', 'final'][Math.floor(r() * 3)];
    const v = { k, cause: k };
    v.tripMM = k === 'setpoint' ? 150 : 297 + Math.round(r() * 6);
    v.key = { pass: ['ramp', 'pumpcheck'], setpoint: ['ramp', 'sisconfig'], final: ['ramp', 'pumpcheck'] }[k];
    v.verify = ['restore', 'reset'];
    return v;
  },
  dcs(v, st) {
    return [
      { tag: 'LT-105', val: st.tested && !st.restored ? T('TEST', 'टेस्ट', 'ٹیسٹ') : '64.0', unit: st.tested && !st.restored ? '' : '%', state: st.tested && !st.restored ? 'frozen' : 'normal' },
      { tag: 'P-101', val: T('Running', 'चालू', 'چل رہا ہے'), state: 'normal' },
      { tag: 'P-101B', val: st.done.has('inform') ? T('Running', 'चालू', 'چل رہا ہے') : T('Standby', 'स्टैंडबाय', 'اسٹینڈ بائی'), state: 'normal' },
    ];
  },
  actions: [
    { id: 'procedure', grp: 'observe', min: 10, label: T('Read the approved proof-test procedure and SRS', 'मंज़ूर प्रूफ़-टेस्ट प्रोसीजर और SRS पढ़ें', 'منظور شدہ پروف ٹیسٹ پروسیجر اور SRS پڑھیں'),
      ev: { en: () => `Procedure PT-SIF-105 rev 3: (1) permit; no SIS bypass, because the test trips the real pump; (2) start standby pump P-101B first; (3) isolate LT-105 on its manifold and apply decreasing pressure with a hand pump; (4) record trip point, LALL-105 alarm and pump stop time; (5) restore and compare LT-105 with LT-101 and LG-101. Trip: ${N('300 mm ±30 mm')}, pump stop ≤ ${N('5 s')}.`, hi: () => `प्रोसीजर PT-SIF-105 rev 3: (1) परमिट; असली पंप ट्रिप होगा इसलिए SIS बाईपास की ज़रूरत नहीं; (2) पहले स्टैंडबाय पंप P-101B चालू करें; (3) LT-105 को मैनिफोल्ड पर आइसोलेट कर हैंड पंप से घटता प्रेशर दें; (4) ट्रिप पॉइंट, LALL-105 अलार्म और पंप रुकने का समय लिखें; (5) रिस्टोर कर LT-105 को LT-101 और LG-101 से मिलाएँ। ट्रिप: ${N('300 mm ±30 mm')}, पंप स्टॉप ≤ ${N('5 s')}।`, ur: () => `پروسیجر PT-SIF-105 rev 3: (1) پرمٹ؛ اصل پمپ ٹرپ ہوگا اس لیے SIS بائی پاس کی ضرورت نہیں؛ (2) پہلے اسٹینڈ بائی پمپ P-101B چلائیں؛ (3) LT-105 کو مینی فولڈ پر آئسولیٹ کر کے ہینڈ پمپ سے گھٹتا پریشر دیں؛ (4) ٹرپ پوائنٹ، LALL-105 الارم اور پمپ رکنے کا وقت لکھیں؛ (5) ریسٹور کر کے LT-105 کو LT-101 اور LG-101 سے ملائیں۔ ٹرپ: ${N('300 mm ±30 mm')}، پمپ اسٹاپ ≤ ${N('5 s')}۔` } },
    { id: 'sisconfig', grp: 'observe', min: 10, label: T('Check the trip setpoint in the SIS configuration (read only)', 'SIS कॉन्फ़िगरेशन में ट्रिप सेटपॉइंट देखें (सिर्फ़ पढ़ें)', 'SIS کنفیگریشن میں ٹرپ سیٹ پوائنٹ دیکھیں (صرف پڑھیں)'),
      ev: { en: v => v.k === 'setpoint' ? `LSLL-105 setpoint in the SIS: ${N('5.0 %')} (150 mm). Change log: “setpoint lowered during start-up, 14 months ago”, no MOC reference.` : `LSLL-105 setpoint in the SIS: ${N('10.0 %')} (300 mm), matches the SRS.`, hi: v => v.k === 'setpoint' ? `SIS में LSLL-105 सेटपॉइंट: ${N('5.0 %')} (150 mm)। चेंज लॉग: “स्टार्ट-अप के दौरान सेटपॉइंट घटाया, 14 महीने पहले”, कोई MOC रेफ़रेंस नहीं।` : `SIS में LSLL-105 सेटपॉइंट: ${N('10.0 %')} (300 mm), SRS से मेल खाता है।`, ur: v => v.k === 'setpoint' ? `SIS میں LSLL-105 سیٹ پوائنٹ: ${N('5.0 %')} (150 mm)۔ چینج لاگ: “اسٹارٹ اپ کے دوران سیٹ پوائنٹ کم کیا، 14 ماہ پہلے”، کوئی MOC ریفرنس نہیں۔` : `SIS میں LSLL-105 سیٹ پوائنٹ: ${N('10.0 %')} (300 mm)، SRS سے ملتا ہے۔` } },
    { id: 'cert', grp: 'tools', min: 5, label: T('Check calibrator and hand-pump certificates', 'कैलिब्रेटर और हैंड पंप के सर्टिफ़िकेट देखें', 'کیلیبریٹر اور ہینڈ پمپ کے سرٹیفکیٹ دیکھیں'),
      ev: { en: () => 'Pressure calibrator PC-03 (0–2 bar module, ±0.025 % FS): certificate valid. Hand pump with fine-adjust vernier OK.', hi: () => 'प्रेशर कैलिब्रेटर PC-03 (0–2 bar मॉड्यूल, ±0.025 % FS): सर्टिफ़िकेट वैध। फ़ाइन-एडजस्ट वर्नियर वाला हैंड पंप ठीक।', ur: () => 'پریشر کیلیبریٹر PC-03 (0–2 bar ماڈیول، ±0.025 % FS): سرٹیفکیٹ درست۔ فائن ایڈجسٹ ورنیئر والا ہینڈ پمپ ٹھیک۔' } },
    { id: 'ramp', grp: 'tools', min: 30, needs: ['permit', 'inform', 'cert'], label: T('Isolate LT-105 and slowly reduce test pressure until the trip', 'LT-105 आइसोलेट करें और ट्रिप तक धीरे-धीरे टेस्ट प्रेशर घटाएँ', 'LT-105 آئسولیٹ کریں اور ٹرپ تک آہستہ آہستہ ٹیسٹ پریشر کم کریں'),
      block: T('This test will really stop P-101. You need the permit, a calibrated reference, and the operator must start standby pump P-101B before you begin.', 'यह टेस्ट सच में P-101 रोकेगा। परमिट, कैलिब्रेटेड रेफ़रेंस चाहिए, और शुरू करने से पहले ऑपरेटर को स्टैंडबाय पंप P-101B चालू करना होगा।', 'یہ ٹیسٹ واقعی P-101 روکے گا۔ پرمٹ اور کیلیبریٹڈ ریفرنس چاہیے، اور شروع کرنے سے پہلے آپریٹر کو اسٹینڈ بائی پمپ P-101B چلانا ہوگا۔'),
      onDo: st => { st.tested = true; },
      ev: {
        en: v => `Applied ${N('600 mmH₂O')}, then reduced slowly. LALL-105 tripped at ${N(v.tripMM + ' mmH₂O (' + f1(v.tripMM / 30) + ' %)')}. SIS output to P-101 de-energised.`,
        hi: v => `${N('600 mmH₂O')} दिया, फिर धीरे-धीरे घटाया। LALL-105 ${N(v.tripMM + ' mmH₂O (' + f1(v.tripMM / 30) + ' %)')} पर ट्रिप हुआ। P-101 के लिए SIS आउटपुट डी-एनर्जाइज़ हुआ।`,
        ur: v => `${N('600 mmH₂O')} دیا، پھر آہستہ آہستہ کم کیا۔ LALL-105 ${N(v.tripMM + ' mmH₂O (' + f1(v.tripMM / 30) + ' %)')} پر ٹرپ ہوا۔ P-101 کے لیے SIS آؤٹ پٹ ڈی انرجائز ہوا۔` } },
    { id: 'pumpcheck', grp: 'field', min: 10, needs: ['inform'], label: T('Check P-101 at the pump and MCC after the trip', 'ट्रिप के बाद P-101 को पंप और MCC पर जाँचें', 'ٹرپ کے بعد P-101 کو پمپ اور MCC پر دیکھیں'),
      ev: {
        en: (v, st) => !st.tested ? 'P-101 is running normally. No trip has been applied yet.' : v.k === 'final' ? 'P-101 is STILL RUNNING after the trip. At the MCC the electrician finds the SIS interposing relay de-energised, but its contacts are welded closed. The final element failed.' : `P-101 stopped ${N('2.1 s')} after the trip. MCC shows “SIS trip”. LALL-105 alarm in the DCS.`,
        hi: (v, st) => !st.tested ? 'P-101 सामान्य चल रहा है। अभी ट्रिप नहीं दिया गया।' : v.k === 'final' ? 'ट्रिप के बाद भी P-101 चल रहा है! MCC पर इलेक्ट्रीशियन को SIS इंटरपोज़िंग रिले डी-एनर्जाइज़्ड मिली, लेकिन उसके कॉन्टैक्ट वेल्ड होकर बंद चिपके हैं। फ़ाइनल एलिमेंट फ़ेल।' : `ट्रिप के ${N('2.1 s')} बाद P-101 रुक गया। MCC पर “SIS trip”। DCS में LALL-105 अलार्म।`,
        ur: (v, st) => !st.tested ? 'P-101 معمول کے مطابق چل رہا ہے۔ ابھی ٹرپ نہیں دیا گیا۔' : v.k === 'final' ? 'ٹرپ کے بعد بھی P-101 چل رہا ہے! MCC پر الیکٹریشن کو SIS انٹرپوزنگ ریلے ڈی انرجائزڈ ملی، مگر اس کے کانٹیکٹ ویلڈ ہو کر بند چپکے ہیں۔ فائنل ایلیمنٹ فیل۔' : `ٹرپ کے ${N('2.1 s')} بعد P-101 رک گیا۔ MCC پر “SIS trip”۔ ڈی سی ایس میں LALL-105 الارم۔` } },
    { id: 'inform', grp: 'safety', min: 10, label: T('Brief the control room; operator starts standby pump P-101B', 'कंट्रोल रूम को ब्रीफ़ करें; ऑपरेटर स्टैंडबाय पंप P-101B चालू करे', 'کنٹرول روم کو بریف کریں؛ آپریٹر اسٹینڈ بائی پمپ P-101B چلائے'),
      ev: { en: () => 'Control room briefed on the test steps. P-101B started and carrying the load. Operator agrees P-101 may trip.', hi: () => 'कंट्रोल रूम को टेस्ट स्टेप्स बताए। P-101B चालू और लोड ले रहा है। ऑपरेटर सहमत कि P-101 ट्रिप हो सकता है।', ur: () => 'کنٹرول روم کو ٹیسٹ کے مراحل بتائے۔ P-101B چالو اور لوڈ لے رہا ہے۔ آپریٹر متفق کہ P-101 ٹرپ ہو سکتا ہے۔' } },
    { id: 'permit', grp: 'safety', min: 15, label: T('Get the permit for the SIF proof test', 'SIF प्रूफ़ टेस्ट का परमिट लें', 'SIF پروف ٹیسٹ کا پرمٹ لیں'),
      ev: { en: () => 'Permit issued with procedure PT-SIF-105 attached.', hi: () => 'प्रोसीजर PT-SIF-105 संलग्न कर परमिट जारी।', ur: () => 'پروسیجر PT-SIF-105 منسلک کر کے پرمٹ جاری۔' } },
    { id: 'restore', grp: 'verify', min: 15, needs: ['inform'], label: T('Restore: remove test kit, open manifold, compare LT-105 with LT-101 and LG-101', 'रिस्टोर: टेस्ट किट हटाएँ, मैनिफोल्ड खोलें, LT-105 को LT-101 और LG-101 से मिलाएँ', 'ریسٹور: ٹیسٹ کٹ ہٹائیں، مینی فولڈ کھولیں، LT-105 کو LT-101 اور LG-101 سے ملائیں'),
      onDo: st => { st.restored = true; },
      ev: { en: () => `Manifold back in service, vent closed. LT-105 ${N('64.0 %')}, LT-101 ${N('64.2 %')}, LG-101 ${N('1920 mm (64 %)')}. They agree.`, hi: () => `मैनिफोल्ड वापस सर्विस में, वेंट बंद। LT-105 ${N('64.0 %')}, LT-101 ${N('64.2 %')}, LG-101 ${N('1920 mm (64 %)')}। तीनों मेल खाते हैं।`, ur: () => `مینی فولڈ واپس سروس میں، وینٹ بند۔ LT-105 ${N('64.0 %')}، LT-101 ${N('64.2 %')}، LG-101 ${N('1920 mm (64 %)')}۔ تینوں ملتے ہیں۔` } },
    { id: 'reset', grp: 'verify', min: 10, label: T('Reset the trip with the operator, return pumps to normal line-up, close permit', 'ऑपरेटर के साथ ट्रिप रीसेट करें, पंप सामान्य लाइन-अप में, परमिट बंद', 'آپریٹر کے ساتھ ٹرپ ری سیٹ کریں، پمپ معمول کی لائن اپ میں، پرمٹ بند'),
      ev: { en: (v, st) => v.k === 'pass' ? 'Trip reset, P-101 restarted by the operator, P-101B back to standby. Permit closed.' : 'Trip reset. The SIF is NOT healthy: compensating measures from your report are in place until it is repaired. Permit closed.', hi: (v, st) => v.k === 'pass' ? 'ट्रिप रीसेट, ऑपरेटर ने P-101 चालू किया, P-101B वापस स्टैंडबाय। परमिट बंद।' : 'ट्रिप रीसेट। SIF ठीक नहीं है: रिपेयर होने तक आपकी रिपोर्ट के कम्पेन्सेटिंग उपाय लागू हैं। परमिट बंद।', ur: (v, st) => v.k === 'pass' ? 'ٹرپ ری سیٹ، آپریٹر نے P-101 چلایا، P-101B واپس اسٹینڈ بائی۔ پرمٹ بند۔' : 'ٹرپ ری سیٹ۔ SIF ٹھیک نہیں ہے: مرمت ہونے تک آپ کی رپورٹ کے متبادل حفاظتی اقدامات نافذ ہیں۔ پرمٹ بند۔' } },
  ],
  causes: [
    { id: 'pass', label: T('PASS: trip point and pump stop are within the SRS', 'PASS: ट्रिप पॉइंट और पंप स्टॉप SRS के अंदर', 'PASS: ٹرپ پوائنٹ اور پمپ اسٹاپ SRS کے اندر') },
    { id: 'setpoint', label: T('FAIL: trip setpoint does not match the SRS', 'FAIL: ट्रिप सेटपॉइंट SRS से मेल नहीं खाता', 'FAIL: ٹرپ سیٹ پوائنٹ SRS سے نہیں ملتا') },
    { id: 'final', label: T('FAIL: final element (pump stop) did not work', 'FAIL: फ़ाइनल एलिमेंट (पंप स्टॉप) काम नहीं किया', 'FAIL: فائنل ایلیمنٹ (پمپ اسٹاپ) کام نہیں کیا') },
    { id: 'tx', label: T('FAIL: LT-105 transmitter is out of calibration', 'FAIL: LT-105 ट्रांसमीटर कैलिब्रेशन से बाहर', 'FAIL: LT-105 ٹرانسمیٹر کیلیبریشن سے باہر') },
  ],
  repairs: [
    { id: 'record', fixes: ['pass'], label: T('No correction needed: record the as-found result as PASS', 'कोई सुधार नहीं: as-found नतीजा PASS दर्ज करें', 'کوئی اصلاح نہیں: as-found نتیجہ PASS درج کریں') },
    { id: 'reportSP', fixes: ['setpoint'], label: T('Record FAIL; raise urgent report to the SIS engineer for an authorised (MOC) setpoint correction; set compensating measures', 'FAIL दर्ज करें; अधिकृत (MOC) सेटपॉइंट सुधार के लिए SIS इंजीनियर को अर्जेंट रिपोर्ट; कम्पेन्सेटिंग उपाय लागू करें', 'FAIL درج کریں؛ مجاز (MOC) سیٹ پوائنٹ اصلاح کے لیے SIS انجینئر کو فوری رپورٹ؛ متبادل حفاظتی اقدامات کریں') },
    { id: 'reportFE', fixes: ['final'], label: T('Record FAIL; replace the welded relay under permit, re-test the pump trip, set compensating measures until then', 'FAIL दर्ज करें; परमिट के तहत वेल्डेड रिले बदलें, पंप ट्रिप दोबारा टेस्ट करें, तब तक कम्पेन्सेटिंग उपाय', 'FAIL درج کریں؛ پرمٹ کے تحت ویلڈ شدہ ریلے تبدیل کریں، پمپ ٹرپ دوبارہ ٹیسٹ کریں، تب تک متبادل حفاظتی اقدامات') },
    { id: 'changeSP', fixes: [], unsafe: true, label: T('Change the SIS setpoint to 10 % yourself and record PASS', 'SIS सेटपॉइंट खुद 10 % कर दें और PASS लिखें', 'SIS سیٹ پوائنٹ خود 10 % کر دیں اور PASS لکھیں') },
    { id: 'recalTx', fixes: [], cost: true, label: T('Recalibrate LT-105', 'LT-105 को दोबारा कैलिब्रेट करें', 'LT-105 کو دوبارہ کیلیبریٹ کریں') },
  ],
  verify: ['restore', 'reset'],

    ma60: T('Output in mA at 60 % level', '60 % लेवल पर आउटपुट mA में', '60 % لیول پر آؤٹ پٹ mA میں'),

/* ================= Game engine ================= */
const STORE_KEY = 'loopcheck_v1';
const S = { lang: null, scores: {}, paid: false };
try { Object.assign(S, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch (e) { }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { } }
const t = o => o == null ? '' : (typeof o === 'string' || typeof o === 'number') ? String(o) : (o[S.lang] ?? o.en);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = s => document.querySelector(s);
const app = () => document.getElementById('app');

let G = null;   // current game (mission run)
let VIEW = 'home';
let resetArmed = false;

/* ---------- career logic ---------- */
const missionsOf = r => MISSIONS.filter(m => m.rank === r);
const passed = id => (S.scores[id] || 0) >= 60;
const rankDone = r => missionsOf(r).every(m => passed(m.id));
function rankOpen(r) { if (r === 0) return true; return rankDone(r - 1); }
function rankPaidOK(r) { return r === 0 || S.paid; }
function gradeIndex() { let g = 0; for (let r = 0; r < RANKS.length; r++) { if (rankDone(r)) g = Math.min(r + 1, RANKS.length - 1); else break; } return g; }
function allDone() { return RANKS.every((_, r) => rankDone(r)); }
const points = () => Object.values(S.scores).reduce((a, b) => a + b, 0);

/* ---------- language ---------- */
function setLang(l) {
  S.lang = l; save();
  document.documentElement.lang = l === 'hi' ? 'hi' : l === 'ur' ? 'ur' : 'en';
  document.documentElement.dir = l === 'ur' ? 'rtl' : 'ltr';
  render();
}
function langSwitch() {
  return `<div class="lang" role="group" aria-label="Language">${[['en', 'English'], ['hi', 'हिंदी'], ['ur', 'اردو']].map(([k, n]) => `<button class="lg ${S.lang === k ? 'on' : ''}" data-lang="${k}" lang="${k}">${n}</button>`).join('')}</div>`;
}

/* ---------- render router ---------- */
function render2D() {
  const y = window.scrollY;
  if (!S.lang) { app().innerHTML = viewLangPick(); bind(); return; }
  document.documentElement.dir = S.lang === 'ur' ? 'rtl' : 'ltr';
  document.documentElement.lang = S.lang;
  if (VIEW === 'home') app().innerHTML = viewHome();
  else if (VIEW === 'mission') app().innerHTML = viewMission();
  else if (VIEW === 'result') app().innerHTML = viewResult();
  bind();
  if (VIEW === 'mission') window.scrollTo(0, y);
}

function viewLangPick() {
  return `<div class="pick"><div class="brand big">LOOP<span>CHECK</span></div>
  <p class="pick-sub">Choose your language · अपनी भाषा चुनें · اپنی زبان منتخب کریں</p>
  <div class="pick-row">
    <button class="pickb" data-lang="en" lang="en"><b>English</b><small>Start in English</small></button>
    <button class="pickb" data-lang="hi" lang="hi"><b>हिंदी</b><small>हिंदी में शुरू करें</small></button>
    <button class="pickb" data-lang="ur" lang="ur" dir="rtl"><b>اردو</b><small>اردو میں شروع کریں</small></button>
  </div></div>`;
}

/* ---------- HOME ---------- */
function viewHome() {
  const g = gradeIndex();
  const pct = Math.round(100 * MISSIONS.filter(m => passed(m.id)).length / MISSIONS.length);
  let h = `<header class="top">${brand()}${langSwitch()}</header>
  <section class="hero">
    <div class="hero-txt"><h1>${t(UI.tagline)}</h1>
      <div class="stats"><div><span class="lbl">${t(UI.grade)}</span><b>${t(RANKS[g].name)}</b></div>
      <div><span class="lbl">${t(UI.xp)}</span><b class="n" dir="ltr">${points()}</b></div>
      <div><span class="lbl">${t(UI.ladder)}</span><b class="n" dir="ltr">${f2(4 + 16 * pct / 100)} mA</b></div></div>
      ${S.paid ? `<p class="paidnote">✓ ${t(UI.full)}</p>` : `<button class="btn amber" data-act="unlock">${t(UI.unlockTitle)} · <span class="n" dir="ltr">${esc(CONFIG.PRICE_TEXT)}</span></button>`}
    </div>
    <div class="meter" aria-hidden="true"><div class="meter-fill" style="height:${pct}%"></div>${[20, 16, 12, 8, 4].map(m => `<span style="bottom:${(m - 4) / 16 * 100}%">${m}</span>`).join('')}</div>
  </section>
  <p class="passmark">${t(UI.passMark)}</p>
  <section class="ladder">`;
  RANKS.forEach((rk, r) => {
    const open = rankOpen(r), paid = rankPaidOK(r), done = rankDone(r);
    const chip = r === 0 ? `<span class="chip free">${t(UI.free)}</span>` : (S.paid ? '' : `<span class="chip paid">${t(UI.full)}</span>`);
    h += `<article class="rung ${done ? 'done' : ''} ${open && paid ? '' : 'shut'}">
      <div class="rung-mA n" dir="ltr">${rk.mA} mA</div>
      <div class="rung-body"><h2>${t(rk.name)} ${chip} ${done ? '<span class="chip ok">✓</span>' : ''}</h2><p>${t(rk.role)}</p>
      <div class="jobs">${missionsOf(r).map(m => {
        const best = S.scores[m.id];
        const can = open && paid;
        return `<div class="job"><div><b>${t(m.title)}</b>${best != null ? `<small class="${best >= 60 ? 'good' : 'warn'}">${t(UI.best)} <span class="n" dir="ltr">${best}</span></small>` : ''}</div>
          ${can ? `<button class="btn sm" data-start="${m.id}">${best != null ? t(UI.replay) : t(UI.play)}</button>`
          : !paid ? `<button class="btn sm ghost" data-act="unlock">🔒 ${t(UI.unlock)}</button>` : `<span class="lockmsg">🔒 ${t(UI.needPrev)}</span>`}</div>`;
      }).join('')}</div></div></article>`;
  });
  h += `</section><footer class="foot"><p>${t(UI.disclaimer)}</p><p>${t(UI.saveNote)} <button class="linkb" data-act="reset">${resetArmed ? t(UI.resetQ) : t(UI.reset)}</button></p></footer>`;
  return h;
}
const brand = () => `<div class="brand">LOOP<span>CHECK</span></div>`;

/* ---------- MISSION START ---------- */
function startMission(id) {
  const m = MISSIONS.find(x => x.id === id);
  const seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
  const r = rngFrom(seed);
  const v = m.setup(r);
  G = { m, v, st: { done: new Set(), log: [], time: 0, blocked: 0, unsafe: 0, hints: 0, diag: null, diagTries: 0, keyBeforeDiag: false, repaired: false, fixed: false, wrongRepairs: 0, costly: 0, verifiedAfterFix: new Set(), stage: 'investigate', pick: null, report: new Set(), claims: new Set(), manual: false, tested: false, restored: false }, modal: null };
  if (m.type === 'calibrate') G.cal = { prep: new Set(), found: {}, left: {}, foundVerdict: null, adj: null, leftVerdict: null, adjTries: 0, off: v.off, slope: v.slope, phase: 'found' };
  if (m.type === 'plan') G.plan = Object.fromEntries(v.jobs.map(j => [j.id, { d: null, needs: new Set() }]));
  if (m.type === 'review') G.rev = { flags: new Set(), decision: null };
  if (m.type === 'calc') G.calc = { ans: {}, tries: 0, res: null };
  VIEW = 'mission';
  window.scrollTo(0, 0);
  render();
}

/* ---------- MISSION VIEW (shared shell) ---------- */
function viewMission() {
  const { m, st } = G;
  const clock = m.budget ? `<div class="clock"><span class="lbl">${t(UI.clock)}</span><b class="n" dir="ltr">${st.time} / ${m.budget} ${t(UI.min)}</b></div>` : '';
  let h = `<header class="mbar"><button class="btn ghost sm" data-act="home">← ${t(UI.back)}</button>
    <div class="mtitle"><span class="lbl">${t(RANKS[m.rank].name)}</span><h1>${t(m.title)}</h1></div>${clock}
    <button class="btn ghost sm" data-act="hint">💬 ${t(UI.mentor)}</button>${langSwitch()}</header>`;
  if (m.type === 'investigate') h += viewInvestigate();
  else if (m.type === 'calibrate') h += viewCalibrate();
  else if (m.type === 'plan') h += viewPlan();
  else if (m.type === 'review') h += viewReview();
  else if (m.type === 'calc') h += viewCalc();
  if (G.modal) h += `<div class="modal" role="dialog" aria-modal="true"><div class="mbox ${G.modal.kind}"><h3>${G.modal.title}</h3><p>${G.modal.body}</p><button class="btn" data-act="closeModal">${t(UI.close)}</button></div></div>`;
  return h;
}
function radioCard() { return `<div class="card radio"><div class="lbl">${G.m.type === 'investigate' ? '📻 ' + t(UI.radio) : '📋 ' + t(UI.brief)}</div><p>${t(G.m.brief)}</p></div>`; }
function dcsCard() {
  if (!G.m.dcs) return '';
  const rows = G.m.dcs(G.v, G.st);
  return `<div class="card dcs"><div class="lbl">${t(UI.dcs)}</div><table>${rows.map(r => `<tr class="${r.state}"><td class="n" dir="ltr">${r.tag}</td><td class="val"><span class="n" dir="ltr">${t(r.val)}</span> <small>${t(r.unit || '')}</small></td><td class="dot" aria-hidden="true"></td></tr>`).join('')}</table></div>`;
}

/* ---------- INVESTIGATE ---------- */
function viewInvestigate() {
  const { m, v, st } = G;
  const groups = ['observe', 'field', 'tools', 'safety', 'verify'];
  let acts = '';
  for (const g of groups) {
    const list = m.actions.filter(a => a.grp === g);
    if (!list.length) continue;
    if (g === 'verify' && !st.repaired) continue;
    acts += `<div class="grp g-${g}"><div class="lbl">${t(UI.grp[g])}</div><div class="abtns">${list.map(a => {
      const did = st.done.has(a.id);
      return `<button class="abtn ${did ? 'did' : ''}" data-a="${a.id}"><span>${t(a.label)}</span><small class="n" dir="ltr">${a.min} ${t(UI.min)}</small></button>`;
    }).join('')}</div></div>`;
  }
  const log = st.log.length ? st.log.slice().reverse().map(e => `<li class="${e.kind || ''}"><div class="lt n" dir="ltr">T+${e.t} ${t(UI.min)}</div><div><b>${e.title()}</b><p>${e.text()}</p></div></li>`).join('') : `<li class="empty">${t(UI.logEmpty)}</li>`;
  return `<div class="mgrid">
    <aside class="col-l">${radioCard()}${dcsCard()}<div class="card plant"><div class="lbl">${t(UI.plant)}</div>${plantSVG(m.focus)}</div></aside>
    <section class="col-m"><div class="card"><h2 class="sec">${t(UI.actions)}</h2>${acts}</div>${decisionPanel()}</section>
    <aside class="col-r"><div class="card logc"><h2 class="sec">${t(UI.log)}</h2><ol class="log">${log}</ol></div></aside>
  </div>`;
}
function decisionPanel() {
  const { m, v, st } = G;
  let h = `<div class="card decide">`;
  if (st.stage === 'investigate' || st.stage === 'diagnose') {
    h += `<h2 class="sec">${t(UI.diagnose)}</h2><p class="q">${t(UI.diagnoseQ)}</p><div class="opts">${m.causes.map(c => `<label class="opt ${st.pick === c.id ? 'on' : ''}"><input type="radio" name="cause" value="${c.id}" ${st.pick === c.id ? 'checked' : ''}> <span>${t(c.label)}</span></label>`).join('')}</div>

function checkCalc() {
  const { v } = G; const C = G.calc;
  document.querySelectorAll('[data-in]').forEach(i => { C.ans[i.dataset.in] = i.value; });
  C.tries++;
  C.res = C.res || {};
  for (const f of v.fields) {
    if (C.res[f.id] === true) continue;
    const a = parseNum(C.ans[f.id]);
    const ok = f.rel ? Math.abs(a - f.ans) <= Math.abs(f.ans) * f.rel : Math.abs(a - f.ans) <= f.tol + 1e-9;
    C.res[f.id] = ok;
    if (ok) C.res[f.id + '_try'] = C.tries;
  }
  render();
}
function scoreCalc() {
  const { v } = G; const C = G.calc; const s = {};
  const each = 100 / v.fields.length;
  s.answers = Math.round(v.fields.reduce((a, f) => a + (C.res && C.res[f.id] ? (C.res[f.id + '_try'] === 1 ? each : each / 2) : 0), 0));
  s.hints = -Math.min(6, 2 * G.st.hints);
  return { s, notes: [], pass: true };
}

/* ---------- RESULT ---------- */
function finish() {
  const m = G.m;
  const before = gradeIndex();
  const R = m.type === 'investigate' ? scoreInvestigate() : m.type === 'calibrate' ? scoreCalibrate() : m.type === 'plan' ? scorePlan() : m.type === 'review' ? scoreReview() : scoreCalc();
  let total = Math.max(0, Math.min(100, Object.values(R.s).reduce((a, b) => a + b, 0)));
  if (!R.pass) total = Math.min(total, 55);
  G.result = { ...R, total };
  S.scores[m.id] = Math.max(S.scores[m.id] || 0, total);
  save();
  G.promoted = gradeIndex() > before;
  G.modal = null;
  VIEW = 'result';
  window.scrollTo(0, 0);
  render();
}
function viewResult() {
  const { m, v, st, result: R } = G;
  const ok = R.total >= 60;
  const max = { safety: 25, diagnosis: 25, repair: 15, verify: 15, report: 10, time: m.type === 'calibrate' ? 15 : 10, prep: 20, asfound: 20, adjust: 25, asleft: 20, plan: 85, capacity: 15, flags: 60, decision: 40, answers: 100 };
  const bars = Object.entries(R.s).map(([k, val]) => k === 'hints' ? (val ? `<div class="sbar neg"><span>${t(UI.sc.hints)}</span><b class="n" dir="ltr">${val}</b></div>` : '') :
    `<div class="sbar"><span>${t(UI.sc[k])}</span><div class="track"><div style="width:${Math.max(0, val) / max[k] * 100}%"></div></div><b class="n" dir="ltr">${val}/${max[k]}</b></div>`).join('');
  const path = st.log.length ? `<div class="card"><h2 class="sec">${t(UI.yourPath)}</h2><ol class="path">${st.log.map(e => `<li><span class="n" dir="ltr">T+${e.t}</span> ${e.title()}</li>`).join('')}</ol></div>` : '';
  const ex = m.explain[S.lang] ? m.explain[S.lang](v) : m.explain.en(v);
  return `<header class="mbar"><button class="btn ghost sm" data-act="home">← ${t(UI.back)}</button><div class="mtitle"><span class="lbl">${t(UI.scoreTitle)}</span><h1>${t(m.title)}</h1></div>${langSwitch()}</header>
  <section class="result"><div class="card scorecard ${ok ? 'pass' : 'fail'}"><div class="big n" dir="ltr">${R.total}</div><div><b>${ok ? t(UI.passed) : t(UI.failed)}</b>${G.promoted ? `<p class="promo">🎖 ${t(UI.promoted)} ${t(RANKS[gradeIndex()].name)}</p>` : ''}</div></div>
  <div class="card">${bars}${R.notes.map(n => `<p class="note">• ${n}</p>`).join('')}</div>
  <div class="card debrief"><h2 class="sec">${t(UI.debrief)}</h2><p class="pre">${esc(ex).replace(/\n/g, '<br>')}</p></div>${path}
  <div class="row"><button class="btn" data-start="${m.id}">${t(UI.replay)}</button><button class="btn ghost" data-act="home">${t(UI.back)}</button></div></section>`;
}

function hint() {
  const { m, v, st } = G;
  let body;
  if (m.type === 'investigate') {
    if (st.hints < 2) body = t(UI.hint[st.hints]);
    else { const k = v.key.find(x => !st.done.has(x)); body = k ? t(UI.hintTry) + ' ' + t(m.actions.find(a => a.id === k).label) : t(UI.hintDone); }
  } else { const hs = TYPE_HINTS[m.type]; body = t(hs[Math.min(st.hints, hs.length - 1)]); }
  st.hints++;
  G.modal = { kind: 'info', title: '💬 ' + t(UI.mentorName), body };
  render();
}

function unlockModal(msg) {
  const box = document.createElement('div');
  box.className = 'modal'; box.id = 'unlockModal';
  box.innerHTML = `<div class="mbox info" role="dialog" aria-modal="true"><h3>${t(UI.unlockTitle)}</h3><p>${t(UI.unlockBody)}</p>
    <a class="btn amber" href="${esc(CONFIG.BUY_URL)}" target="_blank" rel="noopener">${t(UI.buy)} · <span class="n" dir="ltr">${esc(CONFIG.PRICE_TEXT)}</span></a>
    <label for="keyIn" class="lbl">${t(UI.keyLabel)}</label><input id="keyIn" class="n" dir="ltr" autocomplete="off" placeholder="LC-XXXXX-XXXXX-XXXX">
    <p id="keyMsg" class="note">${msg || ''}</p>
    <div class="row"><button class="btn" id="keyGo">${t(UI.unlock)}</button><button class="btn ghost" id="keyClose">${t(UI.close)}</button></div>
    <p class="note small">${esc(CONFIG.CONTACT)}</p></div>`;
  document.body.appendChild(box);
  $('#keyClose').onclick = () => box.remove();
  $('#keyGo').onclick = async () => {
    const k = $('#keyIn').value; if (!k.trim()) return;
    $('#keyMsg').textContent = t(UI.checking);
    if (await checkKey(k)) { S.paid = true; save(); box.remove(); render(); const n = document.createElement('div'); n.className = 'toast'; n.textContent = t(UI.unlocked); document.body.appendChild(n); setTimeout(() => n.remove(), 4000); }
    else $('#keyMsg').textContent = t(UI.badKey);
  };
}

/* ---------- events ---------- */
function bind() {
  app().querySelectorAll('[data-lang]').forEach(b => b.onclick = () => setLang(b.dataset.lang));
  app().querySelectorAll('[data-start]').forEach(b => b.onclick = () => startMission3D(b.dataset.start));
  app().querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b.dataset.act));
  app().querySelectorAll('[data-a]').forEach(b => b.onclick = () => doAction3D(b.dataset.a));
  app().querySelectorAll('input[name=cause]').forEach(i => i.onchange = () => { G.st.pick = i.value; render(); });
  app().querySelectorAll('[data-repair]').forEach(b => b.onclick = () => doRepair3D(b.dataset.repair));
  app().querySelectorAll('[data-rep]').forEach(i => i.onchange = () => { i.checked ? G.st.report.add(i.dataset.rep) : G.st.report.delete(i.dataset.rep); render(); });
  app().querySelectorAll('[data-claim]').forEach(i => i.onchange = () => { i.checked ? G.st.claims.add(i.dataset.claim) : G.st.claims.delete(i.dataset.claim); render(); });
  app().querySelectorAll('[data-prep]').forEach(b => b.onclick = () => { if (!G.cal.prep.has(b.dataset.prep)) { G.cal.prep.add(b.dataset.prep); G.st.time += b.dataset.prep === 'cert' ? 5 : 10; } render(); });
  app().querySelectorAll('[data-pt]').forEach(b => b.onclick = () => openPump(+b.dataset.pt));
  app().querySelectorAll('[data-fv]').forEach(b => b.onclick = () => { G.cal.foundVerdict = b.dataset.fv; render(); });
  app().querySelectorAll('[data-adj]').forEach(b => b.onclick = () => calAdjust(b.dataset.adj));
  app().querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { G.cal.leftVerdict = b.dataset.lv; render(); });
  app().querySelectorAll('[data-job]').forEach(b => b.onclick = () => { G.plan[b.dataset.job].d = b.dataset.d; render(); });
  app().querySelectorAll('[data-need]').forEach(i => i.onchange = () => { const [j, n] = i.dataset.need.split(':'); i.checked ? G.plan[j].needs.add(n) : G.plan[j].needs.delete(n); render(); });
  app().querySelectorAll('[data-flag]').forEach(b => b.onclick = () => { const f = b.dataset.flag; G.rev.flags.has(f) ? G.rev.flags.delete(f) : G.rev.flags.add(f); render(); });
  app().querySelectorAll('[data-dec]').forEach(b => b.onclick = () => { G.rev.decision = b.dataset.dec; finish(); });
  app().querySelectorAll('[data-ch]').forEach(b => b.onclick = () => { const [f, c] = b.dataset.ch.split(':'); document.querySelectorAll('[data-in]').forEach(i => { G.calc.ans[i.dataset.in] = i.value; }); G.calc.ans[f] = c; render(); });
  app().querySelectorAll('[data-in]').forEach(i => i.oninput = () => { G.calc.ans[i.dataset.in] = i.value; });
}
function act(a) {
  if (a === 'home') { VIEW = 'home'; G = null; window.scrollTo(0, 0); return render(); }
  if (a === 'unlock') return unlockModal();
  if (a === 'reset') { if (resetArmed) { S.scores = {}; save(); resetArmed = false; } else resetArmed = true; return render(); }
  if (a === 'closeModal') { G.modal = null; return render(); }
  if (a === 'hint') return hint();
  if (a === 'diagnose') return diagnose();
  if (a === 'rediag') { G.st.stage = 'diagnose'; return render(); }
  if (a === 'toReport') { G.st.stage = 'report'; return render(); }
  if (a === 'submitReport') return finish();
  if (a === 'finishCal') return finish();
  if (a === 'submitPlan') return finish();
  if (a === 'checkCalc') return checkCalc();
  if (a === 'finishCalc') return finish();
}

const P = { pos: new THREE.Vector3(0, 1.65, 14), yaw: 0, pitch: -0.05, keys: {}, joy: { x: 0, y: 0 }, target: null, enabled: false, last: performance.now(), lookId: null };

function setSpawn(x, z, yaw) { P.pos.set(x, 1.65, z); P.yaw = yaw; P.pitch = -0.08; }
function collide(nx, nz) {
  for (const [a, b, c, d] of W.colliders) if (nx > a - RADIUS && nx < c + RADIUS && nz > b - RADIUS && nz < d + RADIUS) return true;
  return false;

function stepPlayer(dt) {
  const k = P.keys;
  let f = (k.KeyW || k.ArrowUp ? 1 : 0) - (k.KeyS || k.ArrowDown ? 1 : 0) - P.joy.y;
  let s = (k.KeyD ? 1 : 0) - (k.KeyA ? 1 : 0) + P.joy.x;

  const dx = (-Math.sin(P.yaw) * f + Math.cos(P.yaw) * s) * sp, dz = (-Math.cos(P.yaw) * f - Math.sin(P.yaw) * s) * sp;
  if (!collide(P.pos.x + dx, P.pos.z)) P.pos.x += dx;

const ray = new THREE.Raycaster();
function aimAt(ndcX = 0, ndcY = 0) {

/* ---------- input ---------- */
function initInput(canvas, onInteract, onKey) {
  addEventListener('keydown', e => { if (e.target.closest && e.target.closest('input,textarea')) return; P.keys[e.code] = true; onKey(e); });
  addEventListener('keyup', e => { P.keys[e.code] = false; });

  let drag = null;
  canvas.addEventListener('pointerdown', e => { if (!P.enabled) return; drag = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now() }; canvas.setPointerCapture(e.pointerId); });

    if (!drag) return;
    const moved = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy);
    if (moved < 8 && performance.now() - drag.t < 400) {
      const r = canvas.getBoundingClientRect();
      const id = aimAt(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      if (id) onInteract(id);
    }
    drag = null;
  });
}

  if (kind === 'meterJB') {
    const open = v.k === 'wire' && !st.fixed;
    if (s.dial === 'Ω') return { txt: 'OL', bad: 'ohm' };
    if (s.dial === 'V' && has('TB2-11 DCS +', 'TB2-12 DCS −')) return { txt: (open ? '23.8' : '10.9') + ' V', ok: 'jb' };
    if (s.dial === 'V' && has('FIELD +', 'FIELD −')) return { txt: open ? '0.00 V' : '10.9 V', ok: 'jb' };
    if (s.dial === 'mA') return { txt: open ? '0.00 mA' : '20.0 mA' };
    return { txt: '0.00 V' };
  }
  if (kind === 'meterRTD') {
    if (s.dial !== 'Ω') return { txt: s.dial === 'V' ? '0.000 V' : '0.00 mA' };
    const RL = v.k === 'corrode' ? 1.8 : v.RL; const ra = RL + (v.k === 'corrode' && !st.fixed ? v.extra : 0); const Rs = SIM.pt100R(v.T);
    if (has('RED', 'WHITE 1')) return { txt: f2(Rs + ra + RL) + ' Ω', ok: 'ab' };
    if (has('WHITE 1', 'WHITE 2')) return { txt: f2(2 * RL) + ' Ω', ok: 'bc' };
    if (has('RED', 'WHITE 2')) return { txt: f2(Rs + ra + RL) + ' Ω' };
  }
  return { txt: '----' };
}
function miniHTML(p) {
  const s = p.state;
  if (p.kind === 'work') return `<div class="workbar"><p>${t(U3.working)}</p><div class="wb"><div></div></div></div>`;
  if (p.kind.startsWith('meter')) {
    const r = meterRead(p.kind, s);
    const terms = TERMS[p.kind];
    return `<button class="btn ghost sm pclose" data-h="back">✕ ${t(U3.closeTool)}</button><h2>🔌 ${t(U3.meterTitle)}</h2><p class="q">${t(U3.meterHelp)}</p>
      <div class="meter3"><div class="mdisp n" dir="ltr">${r.txt}</div>
      <div class="dial">${['OFF', 'V', 'mA', 'Ω'].map(d => `<button class="segb ${s.dial === d ? 'on' : ''}" data-dial="${d}">${d === 'V' ? 'V ⎓' : d}</button>`).join('')}</div></div>
      <div class="terms">${terms.map(x => `<button class="term ${s.red === x ? 'red' : ''} ${s.black === x ? 'black' : ''}" data-term="${x}"><span class="screw"></span><b class="n" dir="ltr">${x}</b><small>${s.red === x ? t(U3.red) : s.black === x ? t(U3.black) : ''}</small></button>`).join('')}</div>
      ${s.msg ? `<p class="note">${s.msg}</p>` : ''}
      <button class="btn amber" data-h="meterRec" ${s.red && s.black && s.dial !== 'OFF' ? '' : 'disabled'}>${t(U3.record)}</button>
      ${s.got.size ? `<p class="evp">✓ ${[...s.got].map(x => s['v_' + x]).join(' · ')}</p>` : ''}`;
  }
  if (p.kind === 'hart' || p.kind === 'hartSend') {
    const lines = s.text ? s.text : '';
    return `<button class="btn ghost sm pclose" data-h="back">✕ ${t(U3.closeTool)}</button><h2>📟 HART</h2><div class="lcd n" dir="ltr">${s.phase === 0 ? 'HART  ·  ' + esc(t(p.kind === 'hart' ? U3.hartConnect : U3.hartSend)) + '<span class="blinkc">_</span>' : lines}</div>`;
  }
  if (p.kind === 'pumpCal' || p.kind === 'pumpTrip') {
    const trip = p.kind === 'pumpTrip';
    const near = !trip && Math.abs(s.p - s.target) <= 0.02;
    const ph = G.cal && G.cal.phase === 'found'; const mA = trip ? null : calMeas(Math.round(s.target * 10), ph ? G.v.off : G.cal.off, ph ? G.v.slope : G.cal.slope) + (s.p - s.target) * 1.6;
    return `<button class="btn ghost sm pclose" data-h="back">✕ ${t(U3.closeTool)}</button><h2>🧰 ${t(U3.pumpTitle)}</h2>
      ${trip ? `<p class="q">${t(U3.rampHelp)}</p>` : `<p class="q">${t(U3.target)}: <b class="n" dir="ltr">${f2(s.target)} bar</b></p>`}
      <div class="calc3"><div class="mdisp n" dir="ltr">${trip ? Math.round(s.p) : f3(s.p)} <small>${s.unit}</small></div>${trip ? `<div class="mdisp n small ${s.tripped ? 'tripd' : ''}" dir="ltr">${s.tripped ? t(U3.trip) : 'LSLL-105: OK'}</div>` : `<div class="mdisp n small" dir="ltr">${f3(Math.max(3.8, mA))} mA</div>`}</div>
      <div class="row"><button class="btn" data-hold="pump">⬆ ${t(U3.pump)}</button>${trip ? `<button class="btn" data-hold="bleed">⬇ ${t(U3.bleed)}</button>` : `<button class="btn ghost" data-fine="1">${t(U3.fineUp)}</button><button class="btn ghost" data-fine="-1">${t(U3.fineDn)}</button>`}<button class="btn ghost" data-h="vent">${t(U3.vent)}</button></div>
      ${trip ? '' : `<button class="btn amber" data-h="calRec" ${near ? '' : 'disabled'}>${t(U3.recordPt)}</button>`}`;
  }
  if (p.kind === 'valve') return `<button class="btn ghost sm pclose" data-h="back">✕ ${t(UI.close)}</button><h2>🔧</h2><p>${t(G.m.repairs.find(r => r.id === p.rep).label)}</p><div class="wb big"><div style="width:${s.prog}%"></div></div><button class="btn amber" data-hold="turn">↻ ${t(U3.turn)}</button>`;

}
let holdTimer = null;
function holdStart(what) {
  holdStop();
  let last = performance.now();
  holdTimer = setInterval(() => {
    const p = UIST.panel; if (!p || !p.state) return holdStop();
    const s = p.state; const now = performance.now(); const k = Math.min(1, (now - last) / 1000) / 0.08; last = now;   // time-based, so slow devices behave the same
    if (what === 'pump') { s.p += k * (p.kind === 'pumpTrip' ? 18 : (s.p < 8 ? 0.12 : 0.06)); }
    if (what === 'bleed') { s.p = Math.max(0, s.p - 4 * k); }
    if (what === 'turn') { s.prog = Math.min(100, s.prog + 4 * k); if (s.prog >= 100) { holdStop(); const id = p.rep; UIST.panel = p.back; doRepair(id); return; } }
    pumpChecks(p); render();
  }, 80);
}
function holdStop() { clearInterval(holdTimer); holdTimer = null; }
function pumpChecks(p) {
  const s = p.state; if (!s) return;
  if (p.kind === 'pumpCal' && s.p > 12 && !s.warned) { s.warned = true; G.st.blocked++; G.modal = { kind: 'bad', title: '⚠', body: t(U3.overP) }; holdStop(); }
  if (p.kind === 'pumpTrip') {
    if (s.p >= 450) s.armed = true;
    if (s.armed && !s.tripped && s.p <= G.v.tripMM) { s.tripped = true; holdStop(); setTimeout(() => { UIST.panel = p.back; doAction('ramp'); }, 1200); }
  }
}
function openPump(pct) { UIST.panel = { type: 'mini', kind: 'pumpCal', back: { type: 'desk' } }; UIST.panel.state = miniInit('pumpCal', pct); render(); }
function hartRun(p) {
  setTimeout(() => {
    if (UIST.panel !== p) return;
    if (p.kind === 'hart') { doAction(p.act); const e = G.st.log[G.st.log.length - 1]; p.state.text = esc(e.text()).replace(/(&lt;[^&]*&gt;)/g, '').replace(/\. /g, '.<br>'); }
    else { const id = p.rep; UIST.panel = p.back; doRepair(id); return; }
    p.state.phase = 1; UIST.panel = p; render();
  }, 1100);
}

/* ---------- events ---------- */
function bind3d() {
  const q = s => app().querySelectorAll(s);
  q('[data-h]').forEach(b => b.onclick = () => hAct(b.dataset.h));
  q('[data-tool]').forEach(b => b.onclick = () => { UIST.tool = b.dataset.tool; render(); });
  q('[data-a3]').forEach(b => b.onclick = () => doAction3D(b.dataset.a3));
  q('[data-r3]').forEach(b => b.onclick = () => doRepair3D(b.dataset.r3));
  q('[data-tab]').forEach(b => b.onclick = () => { UIST.panel.tab = b.dataset.tab; render(); });
  q('[data-dial]').forEach(b => b.onclick = () => { UIST.panel.state.dial = b.dataset.dial; UIST.panel.state.msg = ''; render(); });
  q('[data-term]').forEach(b => b.onclick = () => { const s = UIST.panel.state; const x = b.dataset.term; if (s.red === x) s.red = null; else if (s.black === x) s.black = null; else if (!s.red) s.red = x; else if (!s.black) s.black = x; else { s.red = x; s.black = null; } s.msg = ''; render(); });
  q('[data-fine]').forEach(b => b.onclick = () => { const s = UIST.panel.state; s.p = Math.max(0, s.p + 0.01 * +b.dataset.fine); render(); });
  q('[data-hold]').forEach(b => { b.onpointerdown = e => { e.preventDefault(); holdStart(b.dataset.hold); }; b.onpointerup = b.onpointerleave = b.onpointercancel = holdStop; });
  const joy = document.getElementById('joy'); if (joy) initJoystick(joy);
  if (UIST.panel && (UIST.panel.kind === 'hart' || UIST.panel.kind === 'hartSend') && UIST.panel.state.phase === 0 && !UIST.panel.started) { UIST.panel.started = true; hartRun(UIST.panel); }
}
function hAct(h) {
  const p = UIST.panel;
  if (h === 'close') { UIST.panel = null; return render(); }
  if (h === 'back') { holdStop(); UIST.panel = p.back || null; return render(); }
  if (h === 'notebook') { UIST.panel = UIST.panel && UIST.panel.type === 'notebook' ? null : { type: 'notebook', tab: G.st.stage === 'investigate' ? 'job' : 'decide' }; return render(); }
  if (h === 'radio') { UIST.panel = { type: 'radio' }; return render(); }
  if (h === 'use') { const id = P.lookId; if (id) interact(id); return; }
  if (h === 'desk') { UIST.panel = { type: 'desk' }; return render(); }
  if (h === 'leave') { if (UIST.leaveArmed) { UIST.leaveArmed = false; UIST.panel = null; act('home'); } else { UIST.leaveArmed = true; render(); setTimeout(() => { UIST.leaveArmed = false; if (VIEW === 'mission') render(); }, 3500); } return; }
  if (h === 'vent') { p.state.p = 0; return render(); }
  if (h === 'calRec') { const pct = Math.round(p.state.target * 10); UIST.panel = { type: 'desk' }; calPoint(pct); return; }
  if (h === 'meterRec') {
    const s = p.state; const r = meterRead(p.kind, s);
    if (r.bad === 'short') { G.st.unsafe++; G.modal = { kind: 'bad', title: '⚡ ' + t(UI.unsafeTitle), body: t(U3.shortCircuit) }; s.red = s.black = null; return render(); }
    if (r.bad === 'ohm') { G.st.blocked++; G.modal = { kind: 'warn', title: '✋ ' + t(UI.blockedTitle), body: t(U3.ohmLive) }; s.dial = 'V'; return render(); }
    if (!r.ok) { s.msg = t(U3.notUseful); return render(); }
    s.got.add(r.ok); s['v_' + r.ok] = r.txt;
    const need = p.kind === 'meterRTD' ? ['ab', 'bc'] : [r.ok];
    if (need.every(x => s.got.has(x))) { UIST.panel = p.back; doAction(p.act); return; }
    return render();
  }
}
function onKey(e) {
  if (!S.lang || VIEW !== 'mission' || !G) return;
  if (e.code === 'Escape') { if (G.modal) { G.modal = null; return render(); } if (UIST.panel && UIST.panel.type !== 'brief') { holdStop(); UIST.panel = UIST.panel.back && UIST.panel.type === 'mini' ? UIST.panel.back : null; return render(); } }
  if (G.modal || UIST.panel) { if (e.code === 'KeyN' && UIST.panel && UIST.panel.type === 'notebook') { UIST.panel = null; render(); } return; }
  const pl = PLACE[G.m.id];
  if (e.code === 'KeyE' || e.code === 'Enter') { if (P.lookId) interact(P.lookId); }
  if (e.code === 'KeyN' && !pl.desk) hAct('notebook');
  if (e.code === 'KeyR' && !pl.desk) hAct('radio');
  const tool = TOOLS.find(x => 'Digit' + x.key === e.code); if (tool && !pl.desk) { UIST.tool = tool.id; render(); }
}

/* ---------- frame loop ---------- */
const tmpV = new THREE.Vector3();
function frame() {
  requestAnimationFrame(frame);
  if (!W.ready) return;
  const now = performance.now(); const dt = Math.min(0.05, (now - P.last) / 1000); P.last = now;
  if (VIEW === 'mission' && G) {
    if (P.enabled) stepPlayer(dt); else { W.cam.position.set(P.pos.x, P.pos.y, P.pos.z); W.cam.rotation.set(P.pitch, P.yaw, 0, 'YXZ'); }
    // targeting prompt
    const id = P.enabled ? aimAt(0, 0) : null; P.lookId = id;
    const pr = document.getElementById('prompt');
    if (pr) { if (id) { pr.hidden = false; const txt = `<span class="kbd">E</span> ${esc(t(W.inter[id].label))}`; if (pr._t !== txt) { pr.innerHTML = txt; pr._t = txt; } } else pr.hidden = true; }
    // objective marker
    const mk = document.getElementById('marker');
    const goal = UIST.goal || PLACE[G.m.id].job;
    if (mk && goal && W.inter[goal]) {
      const d = distTo(goal);
      if (d < 5 && UIST.goal === goal) UIST.goal = null;
      tmpV.copy(W.inter[goal].pos); tmpV.y += 0.9; tmpV.project(W.cam);
      const vis = d > 4 && tmpV.z < 1 && Math.abs(tmpV.x) < 1.1 && Math.abs(tmpV.y) < 1.1;
      mk.hidden = !vis; if (vis) { mk.style.left = ((tmpV.x + 1) / 2 * innerWidth) + 'px'; mk.style.top = ((1 - tmpV.y) / 2 * innerHeight) + 'px'; mk.dataset.d = Math.round(d) + ' m'; }
    }
  } else {
    orbit += dt * 0.05;
    W.cam.position.set(2 + Math.sin(orbit) * 26, 9, 2 + Math.cos(orbit) * 26); W.cam.lookAt(2, 1.5, 0);
  }
  for (const pmp of [W.live.pumpA, W.live.pumpB]) if (pmp && pmp.run) { pmp.cpl.rotation.x += dt * 25; pmp.fan.rotation.x += dt * 25; }

}
function boot3d() {

boot3d();
</script>

(()=>{const b=document.getElementById('site-fullscreen-btn');const fs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);const update=()=>b.textContent=fs()?'⛶ Exit Full Screen':'⛶ Full Screen';b.addEventListener('click',async()=>{try{if(fs()){if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen()}else{const e=document.documentElement;if(e.requestFullscreen)await e.requestFullscreen();else if(e.webkitRequestFullscreen)e.webkitRequestFullscreen();else alert('Use your browser menu and choose Full screen.')}}catch(e){alert('Your browser blocked full screen. Tap the button again or use the browser menu.')}update()});document.addEventListener('fullscreenchange',update);document.addEventListener('webkitfullscreenchange',update);update()})();
